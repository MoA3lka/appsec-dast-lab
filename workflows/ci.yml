name: CI

on:
  push:
  pull_request:

jobs:
  code-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Security scan with bandit (SAST)
        run: python -m bandit -r zap_summary.py

      - name: Run tests
        run: python -m pytest -v

  dast-scan:
    runs-on: ubuntu-latest
    needs: code-checks

    services:
      juice-shop:
        image: bkimminich/juice-shop:v17.1.1
        ports:
          - 3000:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for Juice Shop to start
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:3000 && exit 0
            sleep 5
          done
          exit 1

      - name: OWASP ZAP baseline scan (DAST)
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm --network host -v "${{ github.workspace }}/reports:/zap/wrk:rw" \
            zaproxy/zap-stable zap-baseline.py -t http://localhost:3000 \
            -J zap-report.json -r zap-report.html -I

      - name: Summarise findings
        run: python zap_summary.py --input reports/zap-report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Save the reports
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: reports/